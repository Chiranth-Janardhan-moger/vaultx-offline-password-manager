name: Android CI (Debug Build & Test)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@213dcd7645ef0e3d26da512228f0c6c6007cca05 # v3.5.0

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@6012dfb2a907e9616d87e3a15e2123d476627f79 # v4.0.3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Modules
        run: npm ci

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@99b86db111e919e99a749ee0f322e16febbe0f34 # v4.2.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@dbbd9c43ee6cc741585b8a092858602b40a790f7 # v3.5.0

      - name: Run JavaScript/TypeScript Lint
        run: npm run lint

      - name: Run Android Lint
        run: |
          cd android
          ./gradlew lintDebug

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@6012dfb2a907e9616d87e3a15e2123d476627f79 # v4.0.3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Modules
        run: npm ci

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@99b86db111e919e99a749ee0f322e16febbe0f34 # v4.2.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@dbbd9c43ee6cc741585b8a092858602b40a790f7 # v3.5.0

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: vaultx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
