name: Android CD (Release Build & Publish)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag for this release (e.g., v1.3.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Release Tag Environment Variable
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Modules
        run: npm install --legacy-peer-deps

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v4.3.0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v4.3.0

      - name: Setup Keystore
        run: |
          chmod +x android/gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${GITHUB_WORKSPACE}/release.keystore"
          else
            keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/release.keystore" -alias vaultx -keyalg RSA -keysize 2048 -validity 10000 -storepass vaultx123 -keypass vaultx123 -dname "CN=VaultX, OU=Mobile, O=Chiranth, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Build Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease --no-configuration-cache
          ./gradlew bundleRelease --no-configuration-cache
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'vaultx123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'vaultx' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'vaultx123' }}

      - name: Clean Up Keystore File (Always Run)
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/release.keystore"
          echo "Temporary keystore file securely removed."

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build-assets
          if [ -f android/app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-universal-release.apk build-assets/vaultx-${{ env.RELEASE_TAG }}.apk
            cp android/app/build/outputs/apk/release/app-universal-release.apk build-assets/app-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-assets/vaultx-${{ env.RELEASE_TAG }}.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-assets/app-release.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk build-assets/vaultx-${{ env.RELEASE_TAG }}-arm64-v8a.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk build-assets/vaultx-${{ env.RELEASE_TAG }}-armeabi-v7a.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-assets/vaultx-${{ env.RELEASE_TAG }}.aab
          fi

      - name: Generate SHA256 Checksums
        run: |
          cd build-assets
          sha256sum *.apk *.aab > checksums-sha256.txt
          for f in *.apk *.aab; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}-sha256.txt"
            fi
          done
          cat checksums-sha256.txt

      - name: Upload Artifacts to GitHub Run
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: vaultx-release-builds
          path: build-assets/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.0.6
        with:
          name: Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## VaultX Release ${{ env.RELEASE_TAG }}
            
            This release was compiled and signed automatically via our secure GitHub Actions CD pipeline.
            
            ### Included Binaries
            - `app-release.apk`: Universal release APK for direct install and F-Droid.
            - `vaultx-${{ env.RELEASE_TAG }}.apk`: Versioned universal release APK.
            - `vaultx-${{ env.RELEASE_TAG }}-arm64-v8a.apk`: Optimized for 64-bit ARM devices.
            - `vaultx-${{ env.RELEASE_TAG }}-armeabi-v7a.apk`: Optimized for 32-bit ARM devices.
            - `vaultx-${{ env.RELEASE_TAG }}.aab`: Android App Bundle.
            
            ### Checksums for Verification
            Refer to the attached `checksums-sha256.txt` file to verify downloaded assets locally.
          files: build-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release to GitLab
        if: env.GITLAB_PAT != ''
        run: |
          python scripts/gitlab_release_upload.py build-assets/*
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_API_URL: ${{ secrets.GITLAB_API_URL }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
