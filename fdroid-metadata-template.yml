IssueTracker: https://github.com/Chiranth-Janardhan-moger/vaultx-offline-password-manager/issues

RepoType: git
Repo: https://github.com/Chiranth-Janardhan-moger/vaultx-offline-password-manager

Builds:
  - versionName: 1.3.4
    versionCode: 248
    commit: d563e1a66eb64dba0d8d355c97d19091300b02d0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install npm
    init:
      - cd ../..
      - npm install
    gradle:
      - yes
    srclibs:
      - firebase-stub@ce90a956aacda17a85c60577ee443aeb83d876ef
    prebuild:
      - cd ../..
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/installReferrerVersion/,+12d' node_modules/react-native-device-info/android/build.gradle
      - sed -i -e '/installreferrer/d' node_modules/expo-application/android/build.gradle
      - sed -i -e '/com.android.installreferrer.api/d' -e '/StringBuilder()/,/^      })/d' -e '/getInstallReferrerAsync/apromise.resolve("")' node_modules/expo-application/android/src/main/java/expo/modules/application/ApplicationModule.kt
      - sed -i -e '/firebase/d' node_modules/expo-notifications/android/build.gradle
      - cp -a $$firebase-stub$$/firebase-messaging/src node_modules/expo-notifications/android
      - npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.3.4
