plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.chiranth7.vaultx'
version = '1.0.0'

android {
  namespace "com.chiranth7.vaultx.qrscanner"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// CameraX 1.6.0 requires listenablefuture:1.0 at compile time, while React Native pulls
// full Guava which substitutes an empty listenablefuture artifact without this override.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  def camerax_version = "1.6.0"

  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "com.google.zxing:core:3.5.4"
}
